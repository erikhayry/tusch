# Renders a pipeline PR's screenshot baselines again after scripts/sync-branches.sh
# merged main into it and both sides had changed them (it took main's images).
# Started by pipeline.yml, one run per branch (docs/rules/workflow.md, "Pipeline upkeep").
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The PR branch (issue-<n>-…) to render baselines for
        type: string
        required: true

concurrency:
  group: screenshots-${{ inputs.branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  PR_BRANCH: ${{ inputs.branch }}

jobs:
  # Rendering runs the branch's code (install scripts, the app, the tests), so this
  # job gets a read-only token and no stored credentials, and only hands over the
  # images. `baselines` commits them without running anything from the branch.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as CI, so the baselines match what CI renders.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SCREENSHOTS: '1'
    steps:
      - name: Only pipeline branches
        run: |
          if [[ ! "$PR_BRANCH" =~ ^issue-[0-9]+-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Not a pipeline branch: $PR_BRANCH"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      # No cache: this job runs code that hasn't been reviewed yet.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # `changed` rewrites only the baselines that differ from what the code renders.
      - name: Regenerate the changed baselines
        run: pnpm exec svelte-kit sync && pnpm exec playwright test screenshots --update-snapshots=changed

      - name: Collect them
        run: |
          set -euo pipefail
          git ls-files --modified --others --exclude-standard -- ':(glob)src/**/__screenshots__/*.png' > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          tar -cf baselines.tar -T "$RUNNER_TEMP/changed.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: baselines
          path: baselines.tar

  baselines:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the regenerated baselines
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/download-artifact@v8
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines

      - name: Commit and push them
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/baselines/baselines.tar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only images in the baseline folders, whatever the archive held.
          git add -- ':(glob)src/**/__screenshots__/*.png'
          if git diff --cached --quiet; then
            echo "The merged code renders main's baselines; nothing to commit."
            exit 0
          fi
          git commit --quiet -m "Regenerate screenshot baselines after merging main" \
            -m "This branch and main both changed them (scripts/sync-branches.sh)."
          git push --quiet origin "HEAD:refs/heads/$PR_BRANCH"

  # A push made with GITHUB_TOKEN starts no CI run, so start one, also when the
  # rendering failed: CI then fails and the PR goes back to the developer.
  ci:
    needs: [render, baselines]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI for the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"
