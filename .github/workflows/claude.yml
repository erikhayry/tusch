name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Claude pushes as claude[bot] through claude-code-action's credential helper.
          # checkout v5+ persists GITHUB_TOKEN (read-only here) in a way that takes
          # precedence, so pushes failed with 403 (#72; same fix as agents.yml, #145).
          persist-credentials: false

      # Same environment as CI, so Claude can run typecheck and tests before pushing.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # The default tool set is read-only plus git; allow editing files and
          # running the project's checks. No network tools, no arbitrary shell.
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,MultiEdit,Write,Bash(pnpm install:*),Bash(pnpm run check),Bash(pnpm run test:e2e),Bash(pnpm exec playwright test:*),Bash(pnpm exec prettier:*),Bash(pnpm exec svelte-kit sync),Bash(git status:*),Bash(git diff:*),Bash(git log:*),mcp__github__create_pull_request"
