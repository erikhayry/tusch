# Label-driven agent pipeline (docs/agent-workflow-plan.md §6, docs/rules/agents.md).
# Each run invokes one role skill from .claude/skills/ for one issue.
name: Agents

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [closed]
  # WIP limit: start queued issues when capacity frees up (issue #77).
  schedule:
    - cron: '*/30 * * * *'
  # Used by the release job (events from GITHUB_TOKEN start no runs, dispatches do).
  workflow_dispatch:
    inputs:
      issue:
        description: Issue to start /test on (must be labelled status:needs-tests)
        required: true

defaults:
  run:
    shell: bash

jobs:
  # Routing is cheap: no container, so events that start nothing finish in seconds.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      skill: ${{ steps.route.outputs.skill }}
      target: ${{ steps.route.outputs.target }}
      issue: ${{ steps.route.outputs.issue }}
      queued: ${{ steps.route.outputs.queued }}
      turns: ${{ steps.route.outputs.turns }}
      tools: ${{ steps.route.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Route event to a role
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          skill='' ; target='' ; queued=''

          issue_has_label() {
            local number=$1 label=$2
            gh issue view "$number" --json labels --jq '.labels[].name' | grep -qx "$label"
          }
          issue_from_ref() {
            local ref=$1
            printf '%s' "$ref" | sed -nE 's/^issue-([0-9]+)-.*/\1/p'
          }

          case "$EVENT" in
            issues)
              [ "$ACTION" = labeled ] || LABEL=''
              case "$LABEL" in
                status:idea)         skill=plan;    target=$ISSUE ;;
                status:needs-tests)  skill=test;    target=$ISSUE ;;
                status:needs-dev)    skill=develop; target=$ISSUE ;;
                status:needs-review) skill=review;  target=$ISSUE ;;
                *)                   ;;  # other labels start nothing
              esac ;;
            issue_comment|pull_request_review|pull_request_review_comment)
              # Only humans start planning/triage; @claude mentions belong to claude.yml.
              if [ "$SENDER_TYPE" = Bot ] || printf '%s' "$BODY" | grep -q '@claude'; then
                :
              elif [ "$EVENT" = issue_comment ] && [ "$IS_PR_COMMENT" = false ]; then
                if issue_has_label "$ISSUE" status:idea; then skill=plan; target=$ISSUE; fi
              elif [ "$REVIEW_STATE" = approved ] && [ -z "$BODY" ]; then
                :  # a bare approval needs no agent; the human merges
              else
                ref=${HEAD_REF:-$(gh pr view "$PR" --json headRefName --jq .headRefName)}
                n=$(issue_from_ref "$ref")
                if [ -n "$n" ] && issue_has_label "$n" status:needs-human; then skill=triage; target=$n; fi
              fi ;;
            pull_request)
              if [ "$MERGED" = true ] && [ -n "$(issue_from_ref "$HEAD_REF")" ]; then
                skill=tech-lead; target="reconcile $PR"
              fi ;;
            workflow_dispatch)
              if issue_has_label "$DISPATCH_ISSUE" status:needs-tests; then skill=test; target=$DISPATCH_ISSUE; fi ;;
            *) ;;
          esac

          # WIP limit: a new issue only enters the pipeline when fewer than two are in progress.
          if [ "$skill" = test ] && scripts/pipeline-wip.sh full "$target"; then
            queued=$target; skill=''; target=''
          fi

          case "$skill" in
            plan)      turns=40;  tools='Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*)' ;;
            test)      turns=60;  tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(git:*),Bash(pnpm:*)' ;;
            develop)   turns=100; tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh workflow run:*),Bash(gh run:*),Bash(git:*),Bash(pnpm:*)' ;;
            review)    turns=60;  tools='Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git:*),Bash(pnpm:*)' ;;
            triage)    turns=30;  tools='Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)' ;;
            tech-lead) turns=30;  tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(git:*),Bash(pnpm run check:requirements),Bash(pnpm exec playwright test --list:*)' ;;
            *)         turns=0;   tools='' ;;
          esac

          echo "Route: event=$EVENT action=$ACTION label=$LABEL → skill='${skill:-none}' target='$target'"
          {
            echo "skill=$skill"
            echo "target=$target"
            echo "issue=$(printf '%s' "$target" | grep -Eo '^[0-9]+' || true)"
            echo "queued=$queued"
            echo "turns=$turns"
            echo "tools=$tools"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: route
    if: needs.route.outputs.skill != ''
    # One agent per issue at a time. Only real stage runs join this queue, so
    # comments and other no-op events can't displace a pending stage
    # (GitHub keeps one pending run per group and cancels older ones).
    concurrency:
      group: agent-${{ needs.route.outputs.issue || needs.route.outputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same image as CI so screenshot baselines render identically.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
    env:
      PLAYWRIGHT_SCREENSHOTS: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      # The Playwright image lacks unzip (claude-code-action's Bun setup needs it)
      # and the GitHub CLI (every skill uses gh), so install both.
      - name: Install gh and unzip
        run: |
          apt-get update -qq
          apt-get install -y -qq curl gpg unzip >/dev/null
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y -qq gh >/dev/null
          gh --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run /${{ needs.route.outputs.skill }} ${{ needs.route.outputs.target }}
        uses: anthropics/claude-code-action@8a29bc6f0ae11a363721054b6739feba6adabe57 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agents hand off by setting labels as claude[bot]; let those events run the next role.
          allowed_bots: 'claude[bot]'
          additional_permissions: |
            actions: read
          prompt: /${{ needs.route.outputs.skill }} ${{ needs.route.outputs.target }}
          claude_args: |
            --max-turns ${{ needs.route.outputs.turns }}
            --allowedTools "${{ needs.route.outputs.tools }}"

  queue:
    needs: route
    if: needs.route.outputs.queued != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the issue as queued
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.queued }}
        run: |
          gh issue edit "$ISSUE" --add-label queued
          printf '### Pipeline: queued (WIP limit)\n\nTwo issues are already in progress. `/test` starts automatically when one of them is merged, closed or blocked.\n' > /tmp/queued.md
          gh issue comment "$ISSUE" --body-file /tmp/queued.md

  # Starts the oldest queued issue when an issue leaves the pipeline. The
  # schedule also catches capacity freed by events that start no run
  # (e.g. the block job's label change).
  release:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.label.name == 'status:blocked'))
    concurrency:
      group: agent-wip-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Start the oldest queued issue if there is capacity
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          if scripts/pipeline-wip.sh full; then exit 0; fi
          next=$(scripts/pipeline-wip.sh next)
          if [ -z "$next" ]; then echo 'Nothing queued'; exit 0; fi
          gh issue edit "$next" --remove-label queued
          gh workflow run agents.yml --ref "$BRANCH" -f issue="$next"
          echo "Started /test $next"

  # Runs on the plain runner (gh is preinstalled) so it works even if the
  # container or the agent setup fails.
  block:
    needs: [route, agent]
    if: failure() && needs.route.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Block the issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKILL: ${{ needs.route.outputs.skill }}
        run: |
          for label in status:idea status:needs-tests status:needs-dev status:needs-review status:needs-human; do
            gh issue edit "$ISSUE" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE" --add-label status:blocked
          printf '### Pipeline: `/%s` failed\n\nThe agent run failed or hit its turn/time limit: %s\n\nA human needs to check the run, fix the cause, and put the issue back on the right `status:*` label.\n' "$SKILL" "$RUN_URL" > /tmp/blocked.md
          gh issue comment "$ISSUE" --body-file /tmp/blocked.md
