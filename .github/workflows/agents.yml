# Label-driven agent pipeline (docs/agent-workflow-plan.md §6, docs/rules/agents.md).
# Each run invokes one role skill from .claude/skills/ for one issue.
name: Agents

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [closed]
  # SonarCloud failures on pipeline PRs go back to the developer (issue #80).
  check_run:
    types: [completed]
  # WIP limit: start queued issues when capacity frees up (issue #77).
  schedule:
    - cron: '*/30 * * * *'
    # Weekly tech-lead audit (issue #38): Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  # Used by the release job (events from GITHUB_TOKEN start no runs, dispatches do).
  workflow_dispatch:
    inputs:
      issue:
        description: Issue to start; runs /test or /develop for its status:needs-tests or status:needs-dev label
        required: false
      audit:
        description: Run the weekly /tech-lead audit now instead
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  # Routing is cheap: no container, so events that start nothing finish in seconds.
  route:
    if: github.event_name != 'check_run' # handled by the sonar job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      skill: ${{ steps.route.outputs.skill }}
      target: ${{ steps.route.outputs.target }}
      issue: ${{ steps.route.outputs.issue }}
      queued: ${{ steps.route.outputs.queued }}
      turns: ${{ steps.route.outputs.turns }}
      model: ${{ steps.route.outputs.model }}
      automate_tools: ${{ steps.route.outputs.automate_tools }}
      tools: ${{ steps.route.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Route event to a role
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
          DISPATCH_AUDIT: ${{ github.event.inputs.audit }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          skill='' ; target='' ; queued=''

          issue_has_label() {
            local number=$1 label=$2
            gh issue view "$number" --json labels --jq '.labels[].name' | grep -qx "$label"
          }
          issue_from_ref() {
            local ref=$1
            printf '%s' "$ref" | sed -nE 's/^issue-([0-9]+)-.*/\1/p'
          }

          case "$EVENT" in
            issues)
              [ "$ACTION" = labeled ] || LABEL=''
              case "$LABEL" in
                status:idea)         skill=plan;    target=$ISSUE ;;
                status:needs-tests)  skill=test;    target=$ISSUE ;;
                status:needs-dev)    skill=develop; target=$ISSUE ;;
                status:needs-review) skill=reviewer;  target=$ISSUE ;;
                *)                   ;;  # other labels start nothing
              esac ;;
            issue_comment|pull_request_review|pull_request_review_comment)
              # Only humans start planning/triage; @claude mentions belong to claude.yml.
              if [ "$SENDER_TYPE" = Bot ] || printf '%s' "$BODY" | grep -q '@claude'; then
                :
              elif [ "$EVENT" = issue_comment ] && [ "$IS_PR_COMMENT" = false ]; then
                if issue_has_label "$ISSUE" status:idea; then skill=plan; target=$ISSUE; fi
              elif [ "$REVIEW_STATE" = approved ] && [ -z "$BODY" ]; then
                :  # a bare approval needs no agent; the human merges
              else
                ref=${HEAD_REF:-$(gh pr view "$PR" --json headRefName --jq .headRefName)}
                n=$(issue_from_ref "$ref")
                if [ -n "$n" ] && issue_has_label "$n" status:needs-human; then skill=triage; target=$n; fi
              fi ;;
            pull_request)
              if [ "$MERGED" = true ] && [ -n "$(issue_from_ref "$HEAD_REF")" ]; then
                skill=tech-lead; target="reconcile $PR"
              fi ;;
            schedule)
              if [ "$SCHEDULE" = '0 6 * * 1' ]; then skill=tech-lead; target=audit; fi ;;
            workflow_dispatch)
              if [ "$DISPATCH_AUDIT" = true ]; then skill=tech-lead; target=audit
              elif [ -z "$DISPATCH_ISSUE" ]; then :
              elif issue_has_label "$DISPATCH_ISSUE" status:needs-tests; then skill=test; target=$DISPATCH_ISSUE
              elif issue_has_label "$DISPATCH_ISSUE" status:needs-dev; then skill=develop; target=$DISPATCH_ISSUE
              elif issue_has_label "$DISPATCH_ISSUE" status:needs-review; then skill=reviewer; target=$DISPATCH_ISSUE
              elif issue_has_label "$DISPATCH_ISSUE" status:idea; then skill=plan; target=$DISPATCH_ISSUE; fi ;;
            *) ;;
          esac

          # WIP limit: a new issue only enters the pipeline when fewer than two are in progress.
          if [ "$skill" = test ] && scripts/pipeline-wip.sh full "$target"; then
            queued=$target; skill=''; target=''
          fi

          # Turn caps per role. claude-code-action fails a run that ends past its cap even
          # when the work succeeded (#120's tester took 81 turns), so leave headroom;
          # the costs in costs.csv show where a cap is too generous.
          case "$skill" in
            plan)      turns=60;  tools='Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*)' ;;
            test)      turns=120; tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(git:*),Bash(pnpm:*),mcp__plugin_svelte_svelte__list-sections,mcp__plugin_svelte_svelte__get-documentation,mcp__plugin_svelte_svelte__svelte-autofixer' ;;
            develop)   turns=150; tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh workflow run:*),Bash(gh run:*),Bash(git:*),Bash(pnpm:*),mcp__plugin_svelte_svelte__list-sections,mcp__plugin_svelte_svelte__get-documentation,mcp__plugin_svelte_svelte__svelte-autofixer' ;;
            reviewer)    turns=100; tools='Read,Grep,Glob,Write,Agent,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh pr create:*),Bash(gh pr checks:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git:*),Bash(pnpm:*),mcp__plugin_svelte_svelte__list-sections,mcp__plugin_svelte_svelte__get-documentation,mcp__plugin_svelte_svelte__svelte-autofixer' ;;
            triage)    turns=50;  tools='Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)' ;;
            tech-lead) turns=50;  tools='Read,Grep,Glob,Edit,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git:*),Bash(pnpm run check:requirements),Bash(pnpm exec playwright test --list:*)' ;;
            *)         turns=0;   tools='' ;;
          esac

          # Model per role (docs/rules/agents.md, "Models"): the strongest model where
          # judgement matters most (planning, review, the weekly audit), the cheaper
          # one for implementation and routine bookkeeping.
          case "$skill" in
            plan|reviewer) model=opus ;;
            *)           model=sonnet ;;
          esac
          if [ "$target" = audit ]; then turns=100; model=opus; fi  # reads every requirement

          # /automate runs after the audit in the same job (#84). Keep this list equal to
          # `allowed-tools` in .claude/skills/automate/SKILL.md.
          automate_tools='Read,Grep,Glob,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*)'

          echo "Route: event=$EVENT action=$ACTION label=$LABEL → skill='${skill:-none}' target='$target'"
          {
            echo "skill=$skill"
            echo "target=$target"
            echo "issue=$(printf '%s' "$target" | grep -Eo '^[0-9]+' || true)"
            echo "queued=$queued"
            echo "turns=$turns"
            echo "model=$model"
            echo "tools=$tools"
            echo "automate_tools=$automate_tools"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: route
    if: needs.route.outputs.skill != ''
    outputs:
      cost_row: ${{ steps.cost.outputs.row }}
      cost_row_automate: ${{ steps.cost_automate.outputs.row }}
    # One agent per issue at a time. Only real stage runs join this queue, so
    # comments and other no-op events can't displace a pending stage
    # (GitHub keeps one pending run per group and cancels older ones).
    concurrency:
      group: agent-${{ needs.route.outputs.issue || needs.route.outputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60 # audit (up to 100 turns) plus /automate (30 turns), #84
    # Same image as CI so screenshot baselines render identically.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: write # the hand-off check re-dispatches a stage once
    env:
      PLAYWRIGHT_SCREENSHOTS: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      # The Playwright image lacks unzip (claude-code-action's Bun setup needs it)
      # and the GitHub CLI (every skill uses gh), so install both.
      - name: Install gh and unzip
        run: |
          apt-get update -qq
          apt-get install -y -qq curl gpg unzip >/dev/null
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y -qq gh >/dev/null
          gh --version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Agents push as claude[bot] through claude-code-action's credential
          # helper. checkout v5+ persists GITHUB_TOKEN (read-only here) in a way
          # that takes precedence, so pushes failed with 403 (#81). Public repo:
          # fetching needs no credentials.
          persist-credentials: false

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # The agent may switch to an issue branch that predates the script.
      - run: cp scripts/costs.mjs "$RUNNER_TEMP/costs.mjs"

      # For the hand-off check below: only comments after this moment count.
      - run: echo "AGENT_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Facts for the audit (costs, CI re-runs, stuck issues), gathered without AI.
      - name: Gather audit inputs
        if: needs.route.outputs.target == 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit-inputs.sh

      - name: Run /${{ needs.route.outputs.skill }} ${{ needs.route.outputs.target }}
        id: claude
        uses: anthropics/claude-code-action@8a29bc6f0ae11a363721054b6739feba6adabe57 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agents hand off by setting labels as claude[bot]; let those events run the next role.
          # github-actions[bot] is this workflow's own dispatch (WIP release, Sonar bounce):
          # only this repo's workflows can act as it, and `route` still decides what runs.
          allowed_bots: 'claude[bot],github-actions[bot]'
          # Claude's own report on the run's summary page, to see why a run stopped
          # (no tool output; show_full_output stays off because logs are public).
          display_report: 'true'
          # The Svelte MCP (docs + svelte-autofixer), same plugin as .claude/settings.json.
          plugin_marketplaces: https://github.com/sveltejs/ai-tools.git
          plugins: svelte@svelte
          additional_permissions: |
            actions: read
          prompt: /${{ needs.route.outputs.skill }} ${{ needs.route.outputs.target }}
          claude_args: |
            --model ${{ needs.route.outputs.model }}
            --max-turns ${{ needs.route.outputs.turns }}
            --allowedTools "${{ needs.route.outputs.tools }}"

      # Bookkeeping (#50): one costs.csv row per run, also when the agent failed.
      - name: Record cost
        id: cost
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true # bookkeeping must never fail or block a stage
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          ISSUE: ${{ needs.route.outputs.issue }}
          SKILL: ${{ needs.route.outputs.skill }}
          TARGET: ${{ needs.route.outputs.target }}
          CONCLUSION: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "row=$(node "$RUNNER_TEMP/costs.mjs" row "$EXECUTION_FILE")" >> "$GITHUB_OUTPUT"

      - name: Digest of the run
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true # never fail the job
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SKILL: ${{ needs.route.outputs.skill }}
          TARGET: ${{ needs.route.outputs.target }}
          CONCLUSION: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-digest"
          node "$RUNNER_TEMP/costs.mjs" digest "$EXECUTION_FILE" > "$RUNNER_TEMP/agent-digest/${SKILL}.json"

      # The weekly automater (#84): finds repeated actions in last week's digests and files issues.
      - name: Run /automate
        id: automate
        if: ${{ !cancelled() && needs.route.outputs.target == 'audit' && steps.claude.outcome != 'skipped' }}
        continue-on-error: true # the audit's own result decides the job
        uses: anthropics/claude-code-action@8a29bc6f0ae11a363721054b6739feba6adabe57 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot],github-actions[bot]'
          additional_permissions: |
            actions: read
          prompt: /automate
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "${{ needs.route.outputs.automate_tools }}"

      - name: Record cost (automate)
        id: cost_automate
        if: always() && steps.automate.outcome != 'skipped' && steps.automate.outcome != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.automate.outputs.execution_file }}
          ISSUE: ''
          SKILL: automate
          TARGET: audit
          CONCLUSION: ${{ steps.automate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "row=$(node "$RUNNER_TEMP/costs.mjs" row "$EXECUTION_FILE")" >> "$GITHUB_OUTPUT"
          node "$RUNNER_TEMP/costs.mjs" digest "$EXECUTION_FILE" > "$RUNNER_TEMP/agent-digest/automate.json" || true

      - name: Upload digests
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: agent-digest
          path: ${{ runner.temp }}/agent-digest
          retention-days: 14
          if-no-files-found: ignore

      # Every role ends with an issue comment (docs/rules/agents.md). A run that
      # "succeeds" without one handed nothing off (#61, #84, #86, #98). The first time,
      # run the same stage again; a second silent stop blocks the issue, listing
      # what was denied.
      - name: Check the hand-off
        if: always() && steps.claude.outcome == 'success' && needs.route.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          SKILL: ${{ needs.route.outputs.skill }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          marker="### Pipeline: \`/$SKILL\` ended without handing off"
          # One line per comment: author, then 1 if it is this stage's silent-stop marker.
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" \
            --jq '.[] | [.user.login, .created_at, (if (.body | startswith("'"$marker"'")) then 1 else 0 end)] | @tsv' \
            > "$RUNNER_TEMP/comments.tsv"
          posted=$(awk -F'\t' -v since="$AGENT_STARTED" '$1 == "claude[bot]" && $2 >= since' "$RUNNER_TEMP/comments.tsv" | wc -l)
          if [[ "$posted" -gt 0 ]]; then echo "Hand-off comment found"; exit 0; fi
          # Silent stops of this stage since the issue last entered it (its status label
          # was added). A restart by a human, or a new hand-off, starts the count again.
          stage=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name | select(startswith("status:"))][0] // ""')
          entered=$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/timeline?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "'"$stage"'") | .created_at' | tail -n1)
          earlier=$(awk -F'\t' -v since="${entered:-0}" '$1 == "github-actions[bot]" && $3 == 1 && $2 >= since' "$RUNNER_TEMP/comments.tsv" | wc -l)
          denied=$(node "$RUNNER_TEMP/costs.mjs" denials "$EXECUTION_FILE")
          last=$(node "$RUNNER_TEMP/costs.mjs" final "$EXECUTION_FILE")
          {
            printf '%s\n\n' "$marker"
            printf 'The run finished without an issue comment or label change: %s\n\n' "$RUN_URL"
            if [[ -n "$denied" ]]; then
              printf 'Tool calls the run was not allowed to make:\n\n%s\n\n' "$denied"
            else
              printf 'No tool calls were denied; see the run summary for Claude'"'"'s report.\n\n'
            fi
            if [[ -n "$last" ]]; then
              printf 'What the agent said last:\n\n%s\n\n' "$(printf '%s\n' "$last" | sed -e 's/@claude/claude/g' -e 's/^/> /')"
            fi
            if [[ "$earlier" -eq 0 ]]; then
              printf 'Retrying `/%s` once.\n' "$SKILL"
            else
              printf 'It stopped silently twice, so the issue is **blocked**. A human needs to decide: allow the tool, do that step by hand (e.g. files under `.claude/` or `.github/workflows/`), or change the ticket. Then move the label back.\n'
            fi
          } > "$RUNNER_TEMP/handoff.md"
          if [[ "$earlier" -eq 0 ]]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/handoff.md"
            gh workflow run agents.yml --ref "$BRANCH" -f issue="$ISSUE"
            exit 0
          fi
          for label in status:idea status:needs-tests status:needs-dev status:needs-review status:needs-human; do
            gh issue edit "$ISSUE" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE" --add-label status:blocked
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/handoff.md"

  # Appends the row to costs.csv on the unprotected `bookkeeping` branch (pushes
  # to main need a PR; the weekly audit copies the file there, #38) and keeps
  # one "Cost so far" comment on the issue up to date.
  bookkeep:
    needs: [route, agent]
    if: always() && needs.agent.outputs.cost_row != ''
    concurrency:
      group: agent-bookkeeping
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          path: main

      - name: Append to costs.csv
        env:
          ROW: ${{ needs.agent.outputs.cost_row }}
          ROW_AUTOMATE: ${{ needs.agent.outputs.cost_row_automate }}
        run: |
          set -euo pipefail
          cp main/scripts/costs.mjs costs.mjs  # the bookkeeping branch has no scripts
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd main
          if git fetch -q origin bookkeeping; then
            git switch -q -c bookkeeping FETCH_HEAD
          else
            git switch -q --orphan bookkeeping
            node ../costs.mjs header > costs.csv
            echo '{ "git": { "deploymentEnabled": false } }' > vercel.json  # no Vercel previews
            git add vercel.json
          fi
          # Runs are serialised by the concurrency group; retry only for a manual push.
          for attempt in 1 2 3; do
            printf '%s\n' "$ROW" >> costs.csv
            if [[ -n "$ROW_AUTOMATE" ]]; then printf '%s\n' "$ROW_AUTOMATE" >> costs.csv; fi
            git add costs.csv
            git commit -qm "Bookkeeping: $(printf '%s' "$ROW" | cut -d, -f2-4)"
            if git push -q origin HEAD:bookkeeping; then exit 0; fi
            echo "Push attempt $attempt failed; retrying on top of the remote branch"
            git fetch -q origin bookkeeping
            git reset -q --hard FETCH_HEAD
          done
          exit 1

      - name: Append to trust.csv
        continue-on-error: true # measuring trust must never fail or block a stage
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ needs.route.outputs.skill }}
          TARGET: ${{ needs.route.outputs.target }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cp main/scripts/trust.mjs trust.mjs
          ROW=''
          if [[ "$SKILL" == plan && -n "$ISSUE" ]]; then
            ROW=$(node trust.mjs plan "$ISSUE")
          elif [[ "$TARGET" == "reconcile "* ]]; then
            ROW=$(node trust.mjs pr "${TARGET#reconcile }")
          fi
          if [[ -z "$ROW" ]]; then exit 0; fi
          cd main  # the previous step left the bookkeeping branch checked out
          git fetch -q origin bookkeeping
          git reset -q --hard FETCH_HEAD
          for attempt in 1 2 3; do
            if [[ ! -f trust.csv ]]; then node ../trust.mjs header > trust.csv; fi
            printf '%s\n' "$ROW" >> trust.csv
            git add trust.csv
            git commit -qm "Trust: $(printf '%s' "$ROW" | cut -d, -f2-4)"
            if git push -q origin HEAD:bookkeeping; then exit 0; fi
            echo "Push attempt $attempt failed; retrying on top of the remote branch"
            git fetch -q origin bookkeeping
            git reset -q --hard FETCH_HEAD
          done
          exit 1

      - name: Update the Cost so far comment
        if: needs.route.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          set -euo pipefail
          node costs.mjs summary main/costs.csv "$ISSUE" > summary.md
          id=$(gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- cost-so-far -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@summary.md > /dev/null
          else
            gh issue comment "$ISSUE" --body-file summary.md
          fi

  queue:
    needs: route
    if: needs.route.outputs.queued != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the issue as queued
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.queued }}
        run: |
          gh issue edit "$ISSUE" --add-label queued
          printf '### Pipeline: queued (WIP limit)\n\nTwo issues are already in progress. `/test` starts automatically when one of them is merged, closed or blocked.\n' > /tmp/queued.md
          gh issue comment "$ISSUE" --body-file /tmp/queued.md

  # Starts the oldest queued issue when an issue leaves the pipeline. The
  # schedule also catches capacity freed by events that start no run
  # (e.g. the block job's label change).
  release:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.label.name == 'status:blocked'))
    concurrency:
      group: agent-wip-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Start the oldest queued issue if there is capacity
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          if scripts/pipeline-wip.sh full; then exit 0; fi
          next=$(scripts/pipeline-wip.sh next)
          if [ -z "$next" ]; then echo 'Nothing queued'; exit 0; fi
          gh issue edit "$next" --remove-label queued
          gh workflow run agents.yml --ref "$BRANCH" -f issue="$next"
          echo "Started /test $next"

  # A failed SonarCloud analysis on a pipeline PR sends the issue back to
  # /develop with the findings (scripts/sonar-bounce.sh). No AI in this job.
  sonar:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'sonarqubecloud' &&
      github.event.check_run.conclusion == 'failure' &&
      startsWith(github.event.check_run.check_suite.head_branch, 'issue-')
    concurrency:
      group: agent-sonar-${{ github.event.check_run.check_suite.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Send the issue back to the developer
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.check_run.check_suite.head_branch }}
          PR: ${{ github.event.check_run.pull_requests[0].number }}
          SONAR_PROJECT: ${{ github.repository_owner }}_${{ github.event.repository.name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          issue=$(printf '%s' "$HEAD_BRANCH" | sed -nE 's/^issue-([0-9]+)-.*/\1/p')
          if [[ -z "$issue" || -z "$PR" ]]; then echo "No pipeline issue or PR for $HEAD_BRANCH"; exit 0; fi
          scripts/sonar-bounce.sh "$issue" "$PR"

  # Runs on the plain runner (gh is preinstalled) so it works even if the
  # container or the agent setup fails.
  block:
    needs: [route, agent]
    if: failure() && needs.route.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Block the issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKILL: ${{ needs.route.outputs.skill }}
        run: |
          for label in status:idea status:needs-tests status:needs-dev status:needs-review status:needs-human; do
            gh issue edit "$ISSUE" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE" --add-label status:blocked
          printf '### Pipeline: `/%s` failed\n\nThe agent run failed or hit its turn/time limit: %s\n\nA human needs to check the run, fix the cause, and put the issue back on the right `status:*` label.\n' "$SKILL" "$RUN_URL" > /tmp/blocked.md
          gh issue comment "$ISSUE" --body-file /tmp/blocked.md
